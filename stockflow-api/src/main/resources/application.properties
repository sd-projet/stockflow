
spring.application.name=stockflow-api

# Connexion PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/stockflow_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:seneb1003}

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=-1

server.port=${PORT:8080}


# Configuration JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

logging.level.org.springframework.security=INFO
logging.level.com.stockflow.api.security=INFO

