
<main class="login-page">
  <nav class="topbar" aria-label="Navigation principale">
    <a class="brand" routerLink="/" aria-label="StockFlow, accueil">
      <span class="brand-mark">S</span>
      <span>StockFlow</span>
    </a>
    <div class="nav-actions">
      <a class="nav-login" routerLink="/">Accueil</a>
      <a class="nav-login" routerLink="/login">Se connecter</a>
      <a class="button button-primary button-small" routerLink="/register">Créer un compte <i class="bi bi-arrow-up-right" aria-hidden="true"></i></a>
    </div>
  </nav>

  <div class="login-content">
  <section class="login-card">
    <header class="login-header">
      <div class="brand-mark">S</div>
      <h1>StockFlow ERP</h1>
      <p>Connectez-vous à votre espace de gestion</p>
    </header>

    <form #loginForm="ngForm" (ngSubmit)="submit()">
      <div class="form-field">
        <label for="email">Adresse e-mail</label>
        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="credentials.email"
          placeholder="vous@entreprise.fr"
          autocomplete="username"
          required
          email
        />
      </div>

      <div class="form-field">
        <label for="password">Mot de passe</label>
        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="credentials.password"
          placeholder="Votre mot de passe"
          autocomplete="current-password"
          required
        />
      </div>

      @if (errorMessage) {
        <p class="error-message" role="alert">
          {{ errorMessage }}
        </p>
      }

      <button
        type="submit"
        [disabled]="loginForm.invalid || loading"
      >
        {{ loading ? 'Connexion en cours...' : 'Se connecter' }}
      </button>
    </form>

    <p class="login-footer">
      Vous n'avez pas encore de compte ? <a routerLink="/register">Créer un compte</a>
      <span>StockFlow ERP · Gestion des stocks et des approvisionnements</span>
    </p>
  </section>
  </div>
</main>
